name: Build and deploy to dev

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and deploy ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - variant: mock
            base_path: /sosialhjelp/fagsystem-mock
          - variant: fiks
            base_path: /sosialhjelp/fagsystem-fiks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ matrix.base_path }}
      - uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: teamdigisos
          tag: latest
          image_suffix: ${{ matrix.variant }}
      - name: Deploy
        uses: nais/deploy/actions/deploy@v2
        env:
          RESOURCE: nais.yaml
          CLUSTER: dev-gcp
          VARS: nais/dev/${{ matrix.variant }}.json
          REF: ${{ github.sha }}
          PRINT_PAYLOAD: true
          VAR: image=${{ steps.docker-push.outputs.image }}
