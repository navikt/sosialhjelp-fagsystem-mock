version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@navikt"
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
    registries:
      - npm-github
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "[npm]"