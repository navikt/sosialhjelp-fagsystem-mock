apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: {{applicationName}}
  namespace: teamdigisos
  labels:
    team: teamdigisos
spec:
  image: {{image}}
  port: 3000
  ingresses:
{{#each ingresses}}
    - "{{this}}"
{{/each}}
  liveness:
    path: /sosialhjelp/fagsystem-mock/api/internal/isAlive
    initialDelay: 20
    timeout: 1
    periodSeconds: 5
    failureThreshold: 10
  readiness:
    path: /sosialhjelp/fagsystem-mock/api/internal/isAlive
    initialDelay: 20
    timeout: 1
  prometheus:
    enabled: {{prometheusEnabled}}
    path: /actuator/metrics
  replicas:
    min: 1
    max: 2
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 1m
      memory: 64Mi
  env:
    - name: FAGSYSTEM_TARGET
      value: "{{target}}"
    - name: FAGSYSTEM_BACKEND_HOST
      value: "{{backendHost}}"
    - name: FAGSYSTEM_BACKEND_BASE_PATH
      value: "{{backendBasePath}}"
    - name: FAGSYSTEM_BACKEND_HTTPS
      value: "{{backendHttps}}"
{{#if backendPort}}
    - name: FAGSYSTEM_BACKEND_PORT
      value: "{{backendPort}}"
{{/if}}
    - name: INNSYN_URL
      value: "{{innsynUrl}}"
{{#if backendScope}}
    - name: FAGSYSTEM_BACKEND_SCOPE
      value: "{{backendScope}}"
{{/if}}
{{#if azureLogin}}
  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /sosialhjelp/fagsystem-mock/api/internal/*
{{/if}}
  accessPolicy:
    outbound:
{{#if outboundApp}}
      rules:
        - application: {{outboundApp}}
{{/if}}
{{#if outboundHost}}
      external:
        - host: {{outboundHost}}
{{/if}}
